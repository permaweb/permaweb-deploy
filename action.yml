name: 'Permaweb Deploy'
description: 'Deploy static sites to Arweave and optionally update Permaweb Names references.'
author: 'permaweb'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  deploy-key:
    description: 'Arweave JWK wallet (base64-encoded or JSON string) for Arweave signer, or raw private key for upload-only signer flows'
    required: true
  name:
    description: 'The Permaweb Names namespace name to update'
    required: false
  reference-id:
    description: 'Reference ID to update directly, bypassing namespace name lookup'
    required: false
  names-namespace:
    description: 'Namespace root reference or manifest ID used to resolve name'
    required: false
  names-gateway:
    description: 'Gateway used for names reference and namespace reads'
    required: false
    default: 'https://arweave.net'
  names-graphql:
    description: 'GraphQL endpoint used for names reference discovery'
    required: false
  deploy-folder:
    description: 'Path to the folder containing built static files to deploy'
    required: false
    default: './dist'
  deploy-file:
    description: 'Path to a single file to deploy (alternative to deploy-folder)'
    required: false
  sig-type:
    description: 'Signer type for uploads (names updates currently require arweave)'
    required: false
    default: 'arweave'
  uploader:
    description: 'Bundler service base URL. Legacy uploads default to https://up.arweave.net; for HyperBEAM, pass the node URL.'
    required: false
  uploader-type:
    description: 'Bundler protocol to use: legacy or hyperbeam'
    required: false
    default: 'legacy'
  hyperbeam-upload-path:
    description: 'HyperBEAM bundler route used when uploader-type is hyperbeam'
    required: false
    default: '/~bundler@1.0/item?codec-device=ans104@1.0'
  hyperbeam-auto-fund:
    description: 'Automatically fund the HyperBEAM local ledger before upload'
    required: false
    default: 'false'
  hyperbeam-fund-amount:
    description: 'Optional minimum HyperBEAM local ledger balance override, in token base units'
    required: false
  hyperbeam-token-id:
    description: 'Hyperbalance token ID to fund when the node advertises multiple tokens'
    required: false
  hyperbeam-ledger-id:
    description: 'Hyperbalance ledger ID to fund when the node advertises multiple ledgers'
    required: false
  hyperbeam-ao-state-url:
    description: 'AO state endpoint used while waiting for HyperBEAM auto-fund transfer assignment'
    required: false
    default: 'https://state.forward.computer'
  preview:
    description: 'Enable preview mode: auto-generates a namespace name from the PR number and posts a comment with the deployment URL'
    required: false
    default: 'false'
  auto-name:
    description: 'Automatically generate the namespace name from PR number or branch name'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting PR comments (required when preview is enabled)'
    required: false
  no-dedupe:
    description: 'Disable deduplication (do not cache or reuse previous uploads). By default, permaweb-deploy caches your deployment log to prevent uploading duplicate files.'
    required: false
    default: 'false'
  dedupe-cache-max-entries:
    description: 'Maximum number of entries to keep in the dedupe cache (LRU). Default is 10000.'
    required: false

outputs:
  tx-id:
    description: 'The Arweave transaction ID of the uploaded content'
    value: ${{ steps.deploy.outputs.tx-id }}
  deployment-url:
    description: 'The immutable Arweave URL where the deployment is accessible'
    value: ${{ steps.deploy.outputs.deployment-url }}
  name-used:
    description: 'The Permaweb Names namespace name that was used for the deployment'
    value: ${{ steps.name.outputs.name }}
  reference-id:
    description: 'The Permaweb Names reference ID that was updated'
    value: ${{ steps.deploy.outputs.reference-id }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install @permaweb/deploy
      shell: bash
      run: npm install -g @permaweb/deploy

    - name: Restore transaction cache
      id: cache-restore
      if: inputs.no-dedupe != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .permaweb-deploy/transaction-cache.json
        key: permaweb-deploy-transaction-cache

    - name: Determine namespace name
      id: name
      shell: bash
      run: |
        NAME="${{ inputs.name }}"
        REFERENCE_ID="${{ inputs.reference-id }}"
        AUTO_NAME="${{ inputs.auto-name }}"
        PREVIEW="${{ inputs.preview }}"

        if [[ "$PREVIEW" == "true" ]]; then
          AUTO_NAME="true"
        fi

        if [[ "$AUTO_NAME" == "true" ]]; then
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          GENERATED_NAME=""

          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            GENERATED_NAME="${REPO_NAME}-pr-${{ github.event.pull_request.number }}"
            echo "Auto-generated namespace name from PR: $GENERATED_NAME"
          elif [[ -n "${{ github.ref_name }}" && "${{ github.ref_name }}" != "main" && "${{ github.ref_name }}" != "master" ]]; then
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            GENERATED_NAME="${REPO_NAME}-${BRANCH_NAME}"
            echo "Auto-generated namespace name from branch: $GENERATED_NAME"
          fi

          if [[ -n "$GENERATED_NAME" ]]; then
            NAME="$GENERATED_NAME"
          fi
        fi

        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Deploy to Permaweb
      id: deploy
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        if [[ "$DEPLOY_KEY" =~ ^[A-Za-z0-9+/]+=*$ ]]; then
          echo "Deploy key appears to be base64 encoded"
        elif [[ "$DEPLOY_KEY" =~ ^\{.*\}$ ]]; then
          echo "Deploy key is JSON, encoding to base64"
          DEPLOY_KEY=$(echo -n "$DEPLOY_KEY" | base64)
        fi

        NAME="${{ steps.name.outputs.name }}"
        ARGS=(--sig-type "${{ inputs.sig-type }}")

        if [[ -n "$NAME" ]]; then
          ARGS+=(--use-names)
          ARGS+=(--name "$NAME")
        fi
        if [[ -n "${{ inputs.reference-id }}" ]]; then
          ARGS+=(--use-names)
          ARGS+=(--reference-id "${{ inputs.reference-id }}")
        fi
        if [[ -n "${{ inputs.names-namespace }}" ]]; then
          ARGS+=(--names-namespace "${{ inputs.names-namespace }}")
        fi
        ARGS+=(--names-gateway "${{ inputs.names-gateway }}")
        if [[ -n "${{ inputs.names-graphql }}" ]]; then
          ARGS+=(--names-graphql "${{ inputs.names-graphql }}")
        fi

        if [[ -n "${{ inputs.deploy-file }}" ]]; then
          ARGS+=(--deploy-file "${{ inputs.deploy-file }}")
        else
          ARGS+=(--deploy-folder "${{ inputs.deploy-folder }}")
        fi

        ARGS+=(--uploader-type "${{ inputs.uploader-type }}")
        if [[ -n "${{ inputs.uploader }}" ]]; then
          ARGS+=(--uploader "${{ inputs.uploader }}")
        fi
        if [[ "${{ inputs.uploader-type }}" == "hyperbeam" ]]; then
          ARGS+=(--hyperbeam-upload-path "${{ inputs.hyperbeam-upload-path }}")
          if [[ "${{ inputs.hyperbeam-auto-fund }}" == "true" ]]; then
            ARGS+=(--hyperbeam-auto-fund)
          fi
          if [[ -n "${{ inputs.hyperbeam-fund-amount }}" ]]; then
            ARGS+=(--hyperbeam-fund-amount "${{ inputs.hyperbeam-fund-amount }}")
          fi
          if [[ -n "${{ inputs.hyperbeam-token-id }}" ]]; then
            ARGS+=(--hyperbeam-token-id "${{ inputs.hyperbeam-token-id }}")
          fi
          if [[ -n "${{ inputs.hyperbeam-ledger-id }}" ]]; then
            ARGS+=(--hyperbeam-ledger-id "${{ inputs.hyperbeam-ledger-id }}")
          fi
          if [[ -n "${{ inputs.hyperbeam-ao-state-url }}" ]]; then
            ARGS+=(--hyperbeam-ao-state-url "${{ inputs.hyperbeam-ao-state-url }}")
          fi
        fi

        if [[ "${{ inputs.no-dedupe }}" == "true" ]]; then
          ARGS+=(--no-dedupe)
        elif [[ -n "${{ inputs.dedupe-cache-max-entries }}" ]]; then
          ARGS+=(--dedupe-cache-max-entries "${{ inputs.dedupe-cache-max-entries }}")
        fi

        echo "Running: permaweb-deploy deploy ${ARGS[*]}"

        OUTPUT=$(permaweb-deploy deploy "${ARGS[@]}" 2>&1) || {
          echo "Deployment failed"
          echo "$OUTPUT"
          exit 1
        }

        echo "$OUTPUT"

        TX_ID=$(echo "$OUTPUT" | grep -oP 'Tx ID\s*│\s*\K[a-zA-Z0-9_-]{43}' || echo "")
        if [[ -z "$TX_ID" ]]; then
          TX_ID=$(echo "$OUTPUT" | grep -oE '[a-zA-Z0-9_-]{43}' | head -1 || echo "")
        fi

        REFERENCE_ID=$(echo "$OUTPUT" | grep -oP 'Reference ID\s*│\s*\K\S+' || echo "${{ inputs.reference-id }}")
        DEPLOYMENT_URL="https://arweave.net/${TX_ID}"

        echo "tx-id=$TX_ID" >> "$GITHUB_OUTPUT"
        echo "reference-id=$REFERENCE_ID" >> "$GITHUB_OUTPUT"
        echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
        echo "Deployment URL: $DEPLOYMENT_URL"

    - name: Delete old transaction cache
      if: inputs.no-dedupe != 'true' && always()
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache delete permaweb-deploy-transaction-cache 2>/dev/null || true

    - name: Save transaction cache
      if: inputs.no-dedupe != 'true' && always()
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: .permaweb-deploy/transaction-cache.json
        key: permaweb-deploy-transaction-cache

    - name: Comment on PR
      if: inputs.preview == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const deploymentUrl = '${{ steps.deploy.outputs.deployment-url }}';
          const txId = '${{ steps.deploy.outputs.tx-id }}';
          const name = '${{ steps.name.outputs.name }}';
          const referenceId = '${{ steps.deploy.outputs.reference-id }}';

          const body = `## Permaweb Preview Deployed

          Your preview content is available at: **${deploymentUrl}**

          | Property | Value |
          |----------|-------|
          | Transaction ID | \`${txId}\` |
          | Namespace Name | ${name || 'n/a'} |
          | Reference ID | ${referenceId || 'n/a'} |

          The namespace reference has been updated to point at this deployment.`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(comment =>
            comment.body.includes('Permaweb Preview Deployed')
          );

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
